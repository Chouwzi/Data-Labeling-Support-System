# Application config
spring.application.name=datalabeling
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/api/v1}

# H2 Database for testing (in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate config
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for testing
spring.flyway.enabled=false

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT config
security.jwt.secret=${JWT_SECRET:change-me-to-a-secure-secret-key-with-minimum-32-characters}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Enable JMX for Spring Boot Language Server
spring.jmx.enabled=true