# Application config
spring.application.name=datalabeling
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/api/v1}

# PostgreSQL config using Env Vars
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT config
jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToASecureValue1234567890}
jwt.expiration=${JWT_EXPIRATION:3600}
jwt.issuer=${JWT_ISSUER:datalabeling-api}

# Enable JMX for Spring Boot Language Server
spring.jmx.enabled=true

# Jackson Config for Snake Case API
spring.jackson.property-naming-strategy=SNAKE_CASE

# CORS Config
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cors.max-age=${CORS_MAX_AGE:3600}
# Hardcoded Path
app.upload.dir=${UPLOAD_DIR:uploads/}