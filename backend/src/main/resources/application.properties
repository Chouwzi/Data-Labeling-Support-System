# Application config
spring.application.name=datalabeling
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/api/v1}

# PostgreSQL config using Env Vars
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT config
jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToASecureValue1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Enable JMX for Spring Boot Language Server
spring.jmx.enabled=true